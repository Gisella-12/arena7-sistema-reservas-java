<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Arena 7 - Clientes</title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</h:head>

<h:body class="bg-light">

    <nav class="navbar navbar-dark bg-success shadow-sm">
        <div class="container">
            <h:link outcome="dashboard"
                    value="Arena 7"
                    styleClass="navbar-brand fw-bold"/>

            <h:link outcome="dashboard"
                    value="Volver al panel"
                    styleClass="btn btn-outline-light"/>
        </div>
    </nav>

    <main class="container py-5">

        <h1 class="fw-bold text-success">Clientes registrados</h1>

        <p class="text-muted">
            Los clientes se registran automáticamente al guardar una reserva.
        </p>

        <h:form id="clientesForm">

            <h:messages globalOnly="true"
                        styleClass="mb-3"
                        errorClass="text-danger"
                        infoClass="text-success"/>

            <h:panelGroup layout="block"
                          rendered="#{not clienteBean.errorCarga}">

                <p class="fw-semibold">
                    Total de clientes:
                    <h:outputText value="#{clienteBean.totalClientes}"/>
                </p>

            </h:panelGroup>

            <div class="card shadow-sm border-0 rounded-4 mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">

                        <div class="col-md-6">
                            <h:outputLabel for="buscarCliente"
                                           value="Buscar por nombre o DNI"
                                           styleClass="form-label fw-semibold"/>

                            <h:inputText id="buscarCliente"
                                         value="#{clienteBean.buscarCliente}"
                                         styleClass="form-control"/>
                        </div>

                        <div class="col-md-3">
                            <h:commandButton value="Buscar"
                                             action="#{clienteBean.buscar}"
                                             styleClass="btn btn-success w-100"/>
                        </div>

                        <div class="col-md-3">
                            <h:commandButton value="Limpiar"
                                             action="#{clienteBean.limpiar}"
                                             styleClass="btn btn-outline-secondary w-100"/>
                        </div>

                    </div>
                </div>
            </div>

            <h:panelGroup layout="block"
                          rendered="#{not clienteBean.errorCarga}">

                <div class="table-responsive">
                    <h:dataTable value="#{clienteBean.clientesFiltrados}"
                                 var="cliente"
                                 rendered="#{not empty clienteBean.clientesFiltrados}"
                                 styleClass="table table-striped table-hover align-middle bg-white"
                                 headerClass="bg-success text-white">

                        <h:column>
                            <f:facet name="header">ID</f:facet>
                            <h:outputText value="#{cliente.id}"/>
                        </h:column>

                        <h:column>
                            <f:facet name="header">DNI</f:facet>
                            <h:outputText value="#{cliente.dni}"/>
                        </h:column>

                        <h:column>
                            <f:facet name="header">Nombre</f:facet>
                            <h:outputText value="#{cliente.nombre}"/>
                        </h:column>

                        <h:column>
                            <f:facet name="header">Teléfono</f:facet>
                            <h:outputText value="#{cliente.telefono}"/>
                        </h:column>

                    </h:dataTable>
                </div>

                <h:panelGroup layout="block"
                              rendered="#{empty clienteBean.clientesFiltrados}"
                              styleClass="alert alert-info">
                    No se encontraron clientes.
                </h:panelGroup>

            </h:panelGroup>

        </h:form>

    </main>

</h:body>
</html>
