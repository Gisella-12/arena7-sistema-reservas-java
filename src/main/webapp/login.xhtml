<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>
    <title>Arena 7 - Inicio de Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</h:head>

<h:body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow-lg border-0 rounded-4 p-4"
             style="max-width: 430px; width: 100%;">

            <div class="text-center mb-4">
                <h:graphicImage value="/logo.png"
                                alt="Logo Arena 7"
                                style="max-width: 150px; height: auto;"
                                styleClass="mb-3"/>

                <h1 class="fw-bold text-success">Arena 7</h1>

                <p class="text-muted mb-0">
                    Sistema de gestión de reservas deportivas
                </p>
            </div>

            <h:form id="loginForm">

                <h:messages globalOnly="true"
                            styleClass="text-danger mb-3"
                            showDetail="false"/>

                <div class="mb-3">
                    <h:outputLabel for="correo"
                                   value="Correo electrónico"
                                   styleClass="form-label fw-semibold"/>

                    <h:inputText id="correo"
                                 value="#{loginBean.correo}"
                                 styleClass="form-control"
                                 required="true"
                                 requiredMessage="Ingresa tu correo electrónico."/>

                    <h:message for="correo"
                               styleClass="text-danger small"/>
                </div>

                <div class="mb-4">
                    <h:outputLabel for="password"
                                   value="Contraseña"
                                   styleClass="form-label fw-semibold"/>

                    <h:inputSecret id="password"
                                   value="#{loginBean.clave}"
                                   redisplay="false"
                                   styleClass="form-control"
                                   required="true"
                                   requiredMessage="Ingresa tu contraseña."/>

                    <h:message for="password"
                               styleClass="text-danger small"/>
                </div>

                <div class="d-grid">
                    <h:commandButton value="Iniciar sesión"
                                     action="#{loginBean.ingresar}"
                                     styleClass="btn btn-success btn-lg w-100"/>
                </div>

            </h:form>
        </div>
    </div>

</h:body>
</html>
